[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2"
anyhow = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
tokio-util = "0.7"
futures = "0.3"
dirs = "6"
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["fs"] }
argon2 = "0.5"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
serialport = "4.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
mdns-sd = "0.21.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-local-authentication = "0.3.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSError", "NSObjCRuntime"] }
block2 = "0.6.2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serial_test = "3"
